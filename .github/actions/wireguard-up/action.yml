name: "Wireguard UP"
description: "Permet de se connecter à un VPN Wireguard"

inputs:
  wg-config-file:
    description: "Fichier de configuration wireguard pour le client"

runs:
  using: "composite"

  steps:
    - run: |
        sudo apt-get update
        sudo apt install resolvconf wireguard
        sudo echo "${{ inputs.wg-config-file }}" > /etc/wireguard/wg0.conf
        sudo chmod 600 /etc/wireguard/wg0.conf
        echo "Connecting to wireguard"
        sudo wg-quick up wg0
      shell: bash
