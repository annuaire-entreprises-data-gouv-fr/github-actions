name: "Notify message"
description: "Envoie un message dans une room Tchap"

inputs:
  tchap-url:
    description: "URL Tchap qui sera appelé pour envoyer le message"
  tchap-token:
    description: "Jeton d'authentification utilisé"
  trigger-notification:
    description: "Si true, enovie une notification"
    default: "true"
  message:
    description: "Body"
    required: true

runs:
  using: "composite"

  steps:
    - run: |
        MSGTYPE=$( [ "${{ inputs.trigger-notification }}" = "true" ] && echo "m.text" || echo "m.notice" )
        curl -X POST "${{ inputs.tchap-url }}" \
          -H "Authorization: Bearer ${{ inputs.tchap-token }}" \
          -H "Content-Type: application/json" \
          -d '{ "msgtype": "'"$MSGTYPE"'", "body": "${{ inputs.message }}" }'
      shell: bash
